<!DOCTYPE html>

<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1424;--card:#141f36;--tx:#e8eefb;--mu:#93a1bd;--bd:#25324f;--navy:#0a1a3a;--b:#5b8cff;--b2:#35508f;--g:#34d27b;--g2:#1f6b43;--sh:none}}
:root[data-theme="dark"]{--bg:#0c1424;--card:#141f36;--tx:#e8eefb;--mu:#93a1bd;--bd:#25324f;--navy:#0a1a3a;--b:#5b8cff;--b2:#35508f;--g:#34d27b;--g2:#1f6b43;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
aside{position:fixed;inset:0 auto 0 0;width:240px;background:var(--navy);color:#cfdbf5;padding:20px 14px;overflow:auto;transition:transform .25s;z-index:20}
aside h1{color:#fff;font-size:20px;margin:0 8px 2px;letter-spacing:.5px}aside small{display:block;margin:0 8px 22px;color:#8fa6d6}
aside a{display:flex;gap:10px;align-items:center;padding:10px 12px;margin:2px 0;border-radius:10px;color:#cfdbf5;text-decoration:none;transition:.15s}
aside a:hover{background:rgba(255,255,255,.08)}aside a.on{background:var(--b);color:#fff}
main{margin-left:240px;padding:26px 30px 50px;max-width:1280px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}.top h2{margin:0;font-size:24px}.top p{margin:0;color:var(--mu)}
.sp{flex:1}#mb{display:none;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:16px}

.card h3{margin:0 0 12px;font-size:15px}.grid{display:grid;gap:16px;margin-bottom:16px}.k4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpi{transition:.15s}.kpi:hover{transform:translateY(-2px)}.kpi span{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.5px}.kpi b{display:block;font-size:22px;margin:4px 0 0;color:var(--navy)}
:root[data-theme="dark"] .kpi b{color:#fff}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi b{color:#fff}}
.kpi i{font-style:normal;font-size:12px;color:var(--g)}.kpi.bad i{color:var(--r)}

input{width:96px;padding:7px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}input:focus{outline:2px solid var(--b);border-color:transparent}
.btn{background:var(--b);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:600 14px inherit;cursor:pointer;transition:.15s}.btn:hover{filter:brightness(1.1)}.btn.o{background:transparent;color:var(--b);border:1px solid var(--b)}.btn.g{background:var(--g)}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}.ok{background:rgba(22,163,74,.15);color:var(--g)}.wn{background:rgba(217,119,6,.16);color:var(--am)}.er{background:rgba(220,38,38,.14);color:var(--r)}
.ch{width:100%;height:auto}.t{font-size:12px;fill:var(--tx)}.dn{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.lg{list-style:none;padding:0;margin:0;flex:1;min-width:150px}.lg li{display:flex;align-items:center;gap:8px;padding:3px 0}.lg b{margin-left:auto}.lg i{width:10px;height:10px;border-radius:3px}
.note{background:rgba(37,87,214,.08);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;color:var(--mu);margin-bottom:16px}.err{background:rgba(220,38,38,.1);color:var(--r);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.eq{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border-radius:10px;padding:10px 12px;margin:8px 0;overflow-x:auto;white-space:pre;font-size:13px}
#toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:50}#toast.s{opacity:1}
.card p,.card li{color:var(--mu)}.card li{margin:3px 0}
aside{background:linear-gradient(180deg,#0b2a5b,#12408f)}.kpi{border-top:3px solid var(--b)}aside a.pf{display:block;margin:22px 4px 0;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-weight:600}aside a.pf small{margin:2px 0 0;font-weight:400;color:#bcd0f5}aside a.pf:hover{background:rgba(255,255,255,.2)}.kpi:nth-child(3n){border-top-color:var(--g)}.card{animation:up .4s both}@keyframes up{from{opacity:0;transform:translateY(8px)}}
.hero{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center;background:linear-gradient(120deg,#0b2a5b,#2557d6);color:#fff;border-radius:20px;padding:24px 28px;margin-bottom:16px;box-shadow:0 10px 30px rgba(37,87,214,.25)}.hero h2{margin:8px 0 2px;font-size:26px}.hero p{margin:0;opacity:.8}.hs{display:flex;gap:26px;flex-wrap:wrap}.hs b{display:block;font-size:22px}.hs small{opacity:.75}
.lp{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);padding:3px 12px;border-radius:99px;font-size:12px;font-weight:600}.lp i{width:8px;height:8px;border-radius:50%;background:#4ade80;animation:pl 1.4s infinite}@keyframes pl{50%{opacity:.25;transform:scale(1.6)}}
.lr{display:flex;justify-content:space-between;margin-top:10px}.lr b{color:var(--tx)}.pb{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0}.pb div{height:100%;width:0;background:var(--g);transition:width .9s}.tk{list-style:none;padding:0;margin:0}.tk li{padding:8px 0;border-bottom:1px solid var(--bd);animation:up .4s}
@media(max-width:860px){aside{transform:translateX(-100%)}aside.o{transform:none}main{margin-left:0;padding:18px 14px 40px}#mb{display:block}.g2{grid-template-columns:1fr}}
</style></head><body>
<aside id="sd"><h1>SCOP</h1><small>Multan Industries · Supply Chain Optimizer</small><nav id="nv"></nav><a class="pf" href="https://esha949711-crypto.github.io/eshakhurram-portfolio-website/" target="_blank" rel="noopener noreferrer">Esha Khurram<small>Mathematics · AI & Digital Projects · Portfolio ↗</small></a><a class="pf" style="margin-top:8px" href="https://github.com/esha949711-crypto/eshakhurram-portfolio-website" target="_blank" rel="noopener noreferrer">💻 GitHub<small>Portfolio source code ↗</small></a></aside>
<main><div class="top"><button id="mb" aria-label="Menu">☰</button><div><h2 id="ttl"></h2><p id="sub"></p></div><div class="sp"></div><button class="btn" id="run">⚡ Optimize</button></div><div id="mn"></div></main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D0=()=>({sup:[{n:'Multan Cotton Ginners',city:'Multan',price:1800,cap:450,tr:40,rel:.98,lt:1},{n:'Khanewal Agro Supplies',city:'Khanewal',price:1700,cap:400,tr:90,rel:.95,lt:2},{n:'Lahore Fibre Traders',city:'Lahore',price:1650,cap:500,tr:170,rel:.92,lt:3}],
wh:[{n:'Lahore DC',d:250,ship:120,km:340,hrs:6,cap:300},{n:'Karachi DC',d:150,ship:210,km:880,hrs:15,cap:250},{n:'Islamabad DC',d:100,ship:180,km:520,hrs:9,cap:200}],
p:{cap:650,cost:2500,r:2,mh:2,mhA:1400,lh:1.5,lhA:900},
inv:{raw:150,rawMin:100,rawH:25,fg:40,ss:30,fgH:60,pen:9000,sig:6}});
let S=D0(),R=null,cur='dashboard',msg='';
const fm=n=>'Rs '+Math.round(n).toLocaleString('en-PK'),pc=n=>(100*n).toFixed(1)+'%',mm=n=>(n/1e6).toFixed(2)+'M',n1=n=>(+n).toFixed(1);
/* Simplex (Big-M) LP solver: min c.x s.t. rows, x>=0 */
function simplex(c,rows){const n=c.length,M=1e6;rows=rows.map(r=>r.b<0?{a:r.a.map(v=>-v),b:-r.b,t:r.t=='<'?'>':r.t=='>'?'<':'='}:r);
const m=rows.length,ns=rows.filter(r=>r.t!='=').length,na=rows.filter(r=>r.t!='<').length,N=n+ns+na,T=[],B=[];let si=n,ai=n+ns;
const cost=Array(N).fill(0);c.forEach((v,j)=>cost[j]=v);for(let k=n+ns;k<N;k++)cost[k]=M;
rows.forEach(r=>{const w=Array(N+1).fill(0);r.a.forEach((v,j)=>w[j]=v);w[N]=r.b;if(r.t=='<'){w[si]=1;B.push(si++)}else if(r.t=='>'){w[si++]=-1;w[ai]=1;B.push(ai++)}else{w[ai]=1;B.push(ai++)}T.push(w)});
let rc=cost.slice();for(let i=0;i<m;i++){const cb=cost[B[i]];if(cb)for(let j=0;j<N;j++)rc[j]-=cb*T[i][j]}
let it=0;for(;it<8000;it++){let e=-1;for(let j=0;j<N;j++)if(rc[j]<-1e-6){e=j;break}if(e<0)break;
let l=-1,mr=Infinity;for(let i=0;i<m;i++)if(T[i][e]>1e-9){const q=T[i][N]/T[i][e];if(q<mr-1e-12||(Math.abs(q-mr)<=1e-12&&(l<0||B[i]<B[l]))){mr=q;l=i}}
if(l<0)return{status:'unbounded'};const pv=T[l][e];T[l]=T[l].map(v=>v/pv);
for(let i=0;i<m;i++)if(i!=l){const f=T[i][e];if(f)T[i]=T[i].map((v,j)=>v-f*T[l][j])}
const f=rc[e];rc=rc.map((v,j)=>v-f*T[l][j]);B[l]=e}
if(B.some((b,i)=>b>=n+ns&&T[i][N]>1e-6))return{status:'infeasible'};
const x=Array(n).fill(0);B.forEach((b,i)=>{if(b<n)x[b]=Math.max(0,T[i][N])});return{status:'optimal',x,it}}
/* Supply chain model */
function costOf(q,P,y,s,I,Rw){const{sup,wh,p,inv}=S;return{proc:sup.reduce((a,u,i)=>a+u.price*q[i],0),prod:p.cost*P,inv:inv.fgH*I+inv.rawH*Rw,
trans:sup.reduce((a,u,i)=>a+u.tr*q[i],0)+wh.reduce((a,w,k)=>a+w.ship*y[k],0),short:inv.pen*s.reduce((a,v)=>a+v,0)}}
const tot=c=>c.proc+c.prod+c.inv+c.trans+c.short;
function optimize(){const{sup,wh,p,inv}=S,N=12,row=(co,t,b)=>{const a=Array(N).fill(0);for(const k in co)a[k]=co[k];return{a,t,b}};
const c=Array(N).fill(0);sup.forEach((u,i)=>c[i]=u.price+u.tr);c[3]=p.cost;wh.forEach((w,k)=>{c[4+k]=w.ship;c[7+k]=inv.pen});c[10]=inv.fgH;c[11]=inv.rawH;
const rw=[row({0:sup[0].rel,1:sup[1].rel,2:sup[2].rel,3:-p.r,11:-1},'=',-inv.raw),row({11:1},'>',inv.rawMin),row({3:1},'<',p.cap),row({3:p.mh},'<',p.mhA),row({3:p.lh},'<',p.lhA),
row({10:1,3:-1,4:1,5:1,6:1},'=',inv.fg),row({10:1},'>',inv.ss)];sup.forEach((u,i)=>rw.push(row({[i]:1},'<',u.cap)));wh.forEach((w,k)=>{rw.push(row({[4+k]:1,[7+k]:1},'=',w.d));rw.push(row({[4+k]:1},'<',w.cap))});
const r=simplex(c,rw);if(r.status!='optimal')return{status:r.status};const x=r.x,q=x.slice(0,3),P=x[3],y=x.slice(4,7),s=x.slice(7,10),I=x[10],Rw=x[11];
const o=costOf(q,P,y,s,I,Rw),D=wh.reduce((a,w)=>a+w.d,0);
const P0=Math.min(D,p.cap,p.mhA/p.mh,p.lhA/p.lh),F=Math.min(D,P0+inv.fg),y0=wh.map(w=>w.d*F/D),s0=wh.map((w,k)=>w.d-y0[k]),I0=inv.fg+P0-F;
const U=Math.max(0,p.r*P0+inv.rawMin-inv.raw),f=Math.min(1,U/sup.reduce((a,u)=>a+u.rel*u.cap,0)),q0=sup.map(u=>f*u.cap),R0=Math.max(0,inv.raw+sup.reduce((a,u,i)=>a+u.rel*q0[i],0)-p.r*P0);
const b=costOf(q0,P0,y0,s0,I0,R0);return{status:'optimal',q,P,y,s,I,Rw,o,b,D,tO:tot(o),tB:tot(b),unmet:s.reduce((a,v)=>a+v,0),it:r.it,P0,q0,y0}}
function run(){R=optimize();msg=R.status=='optimal'?'':R.status=='infeasible'?'The model is infeasible: your capacities, minimum stock or safety-stock settings cannot all be satisfied together. Increase supplier/production capacity or lower the minimum/safety stock.':'The model is unbounded – please check that all costs are positive.'}
/* charts */
const bars=d=>{const mx=Math.max(...d.map(x=>x.v),1);return`<svg viewBox="0 0 560 ${d.length*34+6}" class="ch">`+d.map((x,i)=>{const w=Math.max(2,300*x.v/mx);return`<text x="0" y="${i*34+21}" class="t">${esc(x.l)}</text><rect x="165" y="${i*34+6}" width="${w}" height="20" rx="5" fill="${x.c||'var(--b)'}"/><text x="${171+w}" y="${i*34+21}" class="t">${esc(x.t??Math.round(x.v))}</text>`}).join('')+'</svg>'};
const grp=(cs,a,b,f2=mm)=>{const mx=Math.max(...a,...b,1);return`<svg viewBox="0 0 560 ${cs.length*52+26}" class="ch"><rect x="0" y="4" width="10" height="10" rx="2" fill="var(--g2)"/><text x="16" y="13" class="t">Before</text><rect x="80" y="4" width="10" height="10" rx="2" fill="var(--b)"/><text x="96" y="13" class="t">After optimization</text>`+cs.map((c,i)=>{const y=i*52+26,w1=Math.max(2,330*a[i]/mx),w2=Math.max(2,330*b[i]/mx);return`<text x="0" y="${y+20}" class="t">${c}</text><rect x="110" y="${y+2}" width="${w1}" height="16" rx="4" fill="var(--g2)"/><text x="${116+w1}" y="${y+15}" class="t">${f2(a[i])}</text><rect x="110" y="${y+22}" width="${w2}" height="16" rx="4" fill="var(--b)"/><text x="${116+w2}" y="${y+35}" class="t">${f2(b[i])}</text>`}).join('')+'</svg>'};
const donut=d=>{const T=d.reduce((s,x)=>s+x.v,0)||1,C=2*Math.PI*60;let off=0;return`<div class="dn"><svg viewBox="0 0 160 160" width="170"><g transform="rotate(-90 80 80)">`+d.map(x=>{const l=C*x.v/T,s=`<circle cx="80" cy="80" r="60" fill="none" stroke="${x.c}" stroke-width="26" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}"/>`;off+=l;return s}).join('')+`</g></svg><ul class="lg">`+d.map(x=>`<li><i style="background:${x.c}"></i>${x.l}<b>${(100*x.v/T).toFixed(1)}%</b></li>`).join('')+'</ul></div>'};
const COL=['#0b2a5b','#2557d6','#16a34a','#7aa7f0','#d97706'];
const parts=c=>[['Procurement',c.proc],['Production',c.prod],['Inventory',c.inv],['Transport',c.trans],['Shortage',c.short]].map((x,i)=>({l:x[0],v:x[1],c:COL[i]}));
const inp=(k,v,st='any')=>`<input type="number" min="0" step="${st}" value="${+(+v).toFixed(4)}" data-k="${k}">`;
const kpi=(l,v,s,bad)=>`<div class="card kpi ${bad?'bad':''}"><span>${l}</span><b>${v}</b><i>${s||'&nbsp;'}</i></div>`;
const tbl=(h,rows)=>`<div class="sc"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
const need=()=>R&&R.status=='optimal'?'':`<div class="err">${esc(msg||'No solution yet.')}</div>`;
const inv=()=>{const{inv:v,p,sup}=S,D=S.wh.reduce((a,w)=>a+w.d,0),du=p.r*D/30,lt=Math.max(...sup.map(u=>u.lt)),ss=1.65*p.r*v.sig*Math.sqrt(lt),rop=du*lt+ss;
const st=v.raw<v.rawMin?['Shortage','er']:v.raw<rop?['Reorder now','wn']:v.raw>rop*2.5?['Overstock','wn']:['Healthy','ok'];return{D,du,lt,ss,rop,st}};
const ok=()=>R&&R.status=='optimal';
const P={
dashboard(){if(!ok())return need();const fl=(R.D-R.unmet)/R.D,wr=R.q.reduce((a,v,i)=>a+v*S.sup[i].rel,0)/Math.max(1e-9,R.q.reduce((a,v)=>a+v,0));
return hero()+live()+`<div class="grid k4">${kpi('Total supply chain cost',fm(R.tO),'Minimum after optimization')}${kpi('Production efficiency',pc(R.P/S.p.cap),'Capacity use: '+n1(R.P)+' / '+S.p.cap+' units')}${kpi('Inventory levels',n1(R.I)+' FG · '+n1(R.Rw)+' RM','Safety stock: '+S.inv.ss+' units')}${kpi('Total raw materials',n1(R.q.reduce((a,v)=>a+v,0))+' units','Bought from 3 suppliers')}${kpi('Supplier performance',pc(wr),'Weighted reliability')}${kpi('Demand fulfilment',pc(fl),R.unmet>.01?'Unmet: '+n1(R.unmet)+' units':'All demand met',R.unmet>.01)}${kpi('Transportation cost',fm(R.o.trans),'Inbound + outbound')}${kpi('Savings after optimization',fm(R.tB-R.tO),pc((R.tB-R.tO)/R.tB)+' vs baseline')}</div>
<div class="grid g2"><div class="card"><h3>Cost breakdown (optimized)</h3>${donut(parts(R.o))}</div><div class="card"><h3>Before vs after (PKR)</h3>${grp(['Procurement','Production','Inventory','Transport'],[R.b.proc,R.b.prod,R.b.inv,R.b.trans],[R.o.proc,R.o.prod,R.o.inv,R.o.trans])}</div>
<div class="card"><h3>Supplier allocation vs capacity (units)</h3>${bars(S.sup.flatMap((u,i)=>[{l:u.n.split(' ').slice(0,2).join(' '),v:R.q[i],c:'var(--b)',t:n1(R.q[i])+' bought'},{l:'  capacity',v:u.cap,c:'var(--b2)',t:u.cap}]))}</div>
<div class="card"><h3>Deliveries by warehouse</h3>${bars(S.wh.map((w,k)=>({l:w.n,v:R.y[k],c:'var(--g)',t:n1(R.y[k])+' / '+w.d})))}</div></div>`},
inventory(){const a=inv(),v=S.inv;return`<div class="note">Reorder point = daily usage × lead time + safety stock; safety stock = 1.65 × σ(raw demand) × √lead time (95% service level). Edit any value to re-test.</div>
<div class="grid k4">${kpi('Raw usage / day',n1(a.du)+' units','Demand ÷ 30 days')}${kpi('Safety stock (raw)',n1(a.ss)+' units','')}${kpi('Reorder point',n1(a.rop)+' units','')}${kpi('Status',`<span class="bd ${a.st[1]}">${a.st[0]}</span>`,'Available stock '+v.raw+' units')}</div>
<div class="card" style="margin-bottom:16px"><h3>Inventory parameters</h3>${tbl(['Item','Available stock','Minimum stock','Holding cost / unit','Demand σ / day','Stock value'],[['Cotton raw material',inp('inv.raw',v.raw),inp('inv.rawMin',v.rawMin),inp('inv.rawH',v.rawH),inp('inv.sig',v.sig),fm(v.raw*v.rawH)],['Finished yarn lots',inp('inv.fg',v.fg),inp('inv.ss',v.ss)+' <small>(safety)</small>',inp('inv.fgH',v.fgH),'–',fm(v.fg*v.fgH)]])}</div>
<div class="card"><h3>Alerts &amp; optimized requirement</h3>${tbl(['Check','Result'],[['Raw stock vs minimum',v.raw<v.rawMin?'<span class="bd er">Shortage – below minimum</span>':'<span class="bd ok">Above minimum</span>'],['Raw stock vs reorder point',v.raw<a.rop?'<span class="bd wn">Below reorder point – order now</span>':'<span class="bd ok">Sufficient</span>'],['Overstock check',v.raw>a.rop*2.5?'<span class="bd wn">Overstock – high holding cost</span>':'<span class="bd ok">No overstock</span>'],['Optimized ending raw / finished stock',ok()?n1(R.Rw)+' / '+n1(R.I)+' units':'–'],['Optimized holding cost',ok()?fm(R.o.inv):'–']])}</div>`},
production(){const p=S.p;return`<div class="card" style="margin-bottom:16px"><h3>Production parameters</h3>${tbl(['Capacity (units)','Cost / unit','Raw per unit','Machine hrs / unit','Machine hrs available','Labour hrs / unit','Labour hrs available'],[[inp('p.cap',p.cap),inp('p.cost',p.cost),inp('p.r',p.r),inp('p.mh',p.mh),inp('p.mhA',p.mhA),inp('p.lh',p.lh),inp('p.lhA',p.lhA)]])}</div>${ok()?`<div class="grid k4">${kpi('Optimal production',n1(R.P)+' units','Demand '+R.D+' units')}${kpi('Capacity utilisation',pc(R.P/p.cap),'')}${kpi('Machine utilisation',pc(p.mh*R.P/p.mhA),'')}${kpi('Labour utilisation',pc(p.lh*R.P/p.lhA),'')}${kpi('Raw material required',n1(p.r*R.P)+' units','')}${kpi('Production cost',fm(R.o.prod),fm(p.cost)+' per unit')}</div>
<div class="card"><h3>Recommendation</h3><p>Produce <b>${n1(R.P)}</b> units: ${R.unmet>.01?'resources cannot cover all demand, so <b>'+n1(R.unmet)+'</b> units remain unmet.':'this meets all demand of '+R.D+' units while keeping the finished-goods safety stock of '+S.inv.ss+' units, using the existing stock of '+S.inv.fg+' units.'}</p>${bars([{l:'Demand',v:R.D,c:'var(--g)'},{l:'Production',v:R.P},{l:'Capacity',v:p.cap,c:'var(--b2)'}])}</div>`:need()}`},
suppliers(){const L=S.sup.map(u=>(u.price+u.tr)/u.rel),rk=[...L].sort((a,b)=>a-b);
return`<div class="card" style="margin-bottom:16px"><h3>Supplier records</h3>${tbl(['Supplier','Price / unit','Capacity','Transport / unit','Reliability (0–1)','Lead time (days)'],S.sup.map((u,i)=>[esc(u.n)+' <small>('+esc(u.city)+')</small>',inp(`sup.${i}.price`,u.price),inp(`sup.${i}.cap`,u.cap),inp(`sup.${i}.tr`,u.tr),inp(`sup.${i}.rel`,u.rel,'0.01'),inp(`sup.${i}.lt`,u.lt)]))}</div>
<div class="grid g2"><div class="card"><h3>Comparison &amp; recommended allocation</h3>${tbl(['Supplier','Landed cost / usable unit','Rank','Allocation','Capacity used'],S.sup.map((u,i)=>[esc(u.n.split(' ').slice(0,2).join(' ')),fm(L[i]),'#'+(rk.indexOf(L[i])+1),ok()?n1(R.q[i])+' units':'–',ok()?pc(R.q[i]/u.cap):'–']))}<p>Landed cost = (price + transport) ÷ reliability.</p></div>
<div class="card"><h3>Landed cost per usable unit</h3>${bars(S.sup.map((u,i)=>({l:u.n.split(' ').slice(0,2).join(' '),v:L[i],t:fm(L[i]),c:COL[i+1]})))}</div></div>${ok()?'':need()}`},
transport(){return`<div class="card" style="margin-bottom:16px"><h3>Warehouses &amp; routes from Multan plant</h3>${tbl(['Warehouse','Demand','Ship cost / unit','Distance (km)','Delivery time (h)','Route capacity'],S.wh.map((w,k)=>[esc(w.n),inp(`wh.${k}.d`,w.d),inp(`wh.${k}.ship`,w.ship),inp(`wh.${k}.km`,w.km),inp(`wh.${k}.hrs`,w.hrs),inp(`wh.${k}.cap`,w.cap)]))}</div>
${ok()?`<div class="grid g2"><div class="card"><h3>Optimized deliveries</h3>${tbl(['Route','Quantity','Route cost','Rs / km / unit'],S.wh.map((w,k)=>[esc(w.n),n1(R.y[k]),fm(R.y[k]*w.ship),(w.ship/w.km).toFixed(3)]))}<p>Outbound: <b>${fm(S.wh.reduce((a,w,k)=>a+w.ship*R.y[k],0))}</b> · Inbound: <b>${fm(S.sup.reduce((a,u,i)=>a+u.tr*R.q[i],0))}</b></p></div>
<div class="card"><h3>Route cost comparison (before vs after)</h3>${grp(S.wh.map(w=>w.n.split(' ')[0]),S.wh.map((w,k)=>w.ship*R.y0[k]),S.wh.map((w,k)=>w.ship*R.y[k]),v=>Math.round(v/1000)+'k')}</div></div>`:need()}`},
optimize(){if(!ok())return need();const rows=[['Procurement',R.b.proc,R.o.proc],['Production',R.b.prod,R.o.prod],['Inventory',R.b.inv,R.o.inv],['Transportation',R.b.trans,R.o.trans],['Shortage',R.b.short,R.o.short],['<b>Total</b>',R.tB,R.tO]];
return`<div class="note">Solved with a Simplex (Big-M) linear-programming engine in ${R.it} pivots on your current inputs. Baseline = produce exactly to demand and buy pro-rata to supplier capacity.</div>
<div class="grid k4">${kpi('Minimum total cost',fm(R.tO),'Saves '+fm(R.tB-R.tO))}${kpi('Recommended production',n1(R.P)+' units','')}${kpi('Demand fulfilment',pc((R.D-R.unmet)/R.D),'Unmet: '+n1(R.unmet)+' units',R.unmet>.01)}${kpi('Transportation cost',fm(R.o.trans),'')}</div>
<div class="grid g2"><div class="card"><h3>Optimal supplier allocation</h3>${tbl(['Supplier','Units to buy','Cost'],S.sup.map((u,i)=>[esc(u.n),n1(R.q[i]),fm((u.price+u.tr)*R.q[i])]))}<p>Required raw materials: <b>${n1(S.p.r*R.P)}</b> units · Ending raw stock: <b>${n1(R.Rw)}</b> · Ending finished stock: <b>${n1(R.I)}</b></p></div>
<div class="card"><h3>Deliveries &amp; unmet demand</h3>${tbl(['Warehouse','Deliver','Unmet'],S.wh.map((w,k)=>[esc(w.n),n1(R.y[k]),n1(R.s[k])]))}</div></div>
<div class="card"><h3>Before vs after optimization</h3>${tbl(['Cost component','Before','After','Change'],rows.map(r=>[r[0],fm(r[1]),fm(r[2]),`<span class="bd ${r[2]<=r[1]+.5?'ok':'wn'}">${r[1]?((r[2]-r[1])/r[1]*100).toFixed(1):'0.0'}%</span>`]))}</div>`},
analytics(){if(!ok())return need();const L=S.sup.map(u=>(u.price+u.tr)/u.rel);
return`<div class="top" style="margin:0 0 16px"><button class="btn g" onclick="exp('csv')">⬇ Export CSV</button><button class="btn o" onclick="exp('pdf')">⬇ Export PDF</button></div>
<div class="grid g2"><div class="card"><h3>Cost breakdown – optimized</h3>${donut(parts(R.o))}</div><div class="card"><h3>Optimization savings</h3>${grp(['Total cost'],[R.tB],[R.tO])}<p>Saving: <b>${fm(R.tB-R.tO)}</b> (${pc((R.tB-R.tO)/R.tB)})</p></div>
<div class="card"><h3>Production performance</h3>${bars([{l:'Demand',v:R.D,c:'var(--g)'},{l:'Production',v:R.P},{l:'Capacity',v:S.p.cap,c:'var(--b2)'},{l:'Machine hrs used',v:S.p.mh*R.P,t:n1(S.p.mh*R.P)+' h'}])}</div>
<div class="card"><h3>Inventory analysis</h3>${bars([{l:'Raw – start',v:S.inv.raw},{l:'Raw – end',v:R.Rw,t:n1(R.Rw)},{l:'Finished – start',v:S.inv.fg,c:'var(--g)'},{l:'Finished – end',v:R.I,c:'var(--g)',t:n1(R.I)}])}</div>
<div class="card"><h3>Supplier comparison</h3>${bars(S.sup.map((u,i)=>({l:u.n.split(' ')[0],v:L[i],t:fm(L[i]),c:COL[i+1]})))}</div>
<div class="card"><h3>Transportation analysis</h3>${bars(S.wh.map((w,k)=>({l:w.n,v:w.ship*R.y[k],t:fm(w.ship*R.y[k]),c:'var(--g)'})))}</div></div>`},
about(){return`<div class="grid g2"><div class="card"><h3>What is supply chain optimization?</h3><p>It is the use of mathematical models to choose procurement, production, storage and delivery decisions together so that total cost is minimized while customer demand is met.</p><h3>Why it matters in manufacturing</h3><p>Raw material and logistics make up most of a manufacturer's cost. In Multan's cotton and textile industry, small differences in supplier price, reliability and freight add up to large savings when decisions are optimized jointly.</p></div>
<div class="card"><h3>Scenario</h3><p>A fictional Multan cotton-yarn mill buys cotton from three suppliers (Multan, Khanewal, Lahore), produces yarn lots at one plant (capacity 650) and delivers 500 lots to Lahore, Karachi and Islamabad warehouses. One unit = one yarn lot; raw units are cotton-lint equivalents. Distances are approximate; all values are editable.</p></div>
<div class="card"><h3>Objective function</h3><div class="eq">Z = Σ(pᵢ+tᵢ)qᵢ + c·P + hF·I + hR·Rw + Σ shipₖ·yₖ + π·Σ sₖ</div><p>Procurement + inbound transport + production + inventory holding + outbound transport + shortage penalty.</p></div>
<div class="card"><h3>Decision variables</h3><ul><li>qᵢ – raw material bought from supplier i</li><li>P – production quantity</li><li>yₖ – units delivered to warehouse k; sₖ – unmet demand</li><li>I – ending finished stock; Rw – ending raw stock</li></ul></div>
<div class="card"><h3>Constraints</h3><div class="eq">Σ ρᵢqᵢ + stock − r·P = Rw ≥ minimum raw
qᵢ ≤ supplier capacity     P ≤ plant capacity
machine and labour hours ≤ available
yₖ + sₖ = demandₖ          yₖ ≤ route capacity
I = I₀ + P − Σyₖ ≥ safety stock     all variables ≥ 0</div><p>ρᵢ is supplier reliability (usable fraction).</p></div>
<div class="card"><h3>Methodology &amp; benefits</h3><p>A Linear Program is solved live in your browser with the Simplex method (Big-M for ≥ and = constraints, Bland's rule against cycling). Every edit re-solves the model – nothing is hard-coded. A baseline policy (produce to demand, buy pro-rata to capacity) is costed with the same function for the before/after comparison.</p><ul><li>Lower total cost and fewer shortages</li><li>Transparent supplier ranking by landed cost</li><li>Right-sized inventory and safe reorder levels</li></ul></div>
<div class="card"><h3>Assumptions &amp; limitations</h3><ul><li>Single product, single period (one month), deterministic demand</li><li>Linear costs; quantities continuous (LP relaxation, no set-up costs)</li><li>One plant; supplier reliability treated as yield</li><li>Safety stock uses a normal approximation (z = 1.65)</li></ul></div></div>`}};
const NAV=[['dashboard','📊','Dashboard'],['inventory','📦','Inventory'],['production','🏭','Production'],['suppliers','🤝','Suppliers'],['transport','🚚','Transportation'],['optimize','⚡','Optimization Results'],['analytics','📈','Analytics & Reports'],['about','📘','About the Model']];
const SUB={dashboard:'Multan Cotton Yarn Mills – KPI overview',inventory:'Stock, reorder points and alerts',production:'Capacity, utilisation and planning',suppliers:'Compare and allocate suppliers',transport:'Routes, cost and delivery time',optimize:'LP solution and before/after impact',analytics:'Charts and downloadable reports',about:'Academic documentation of the model'};
function render(){$('#nv').innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${n[0]==cur?'on':''}">${n[1]} ${n[2]}</a>`).join('');const nm=NAV.find(n=>n[0]==cur);$('#ttl').textContent=nm[2];$('#sub').textContent=SUB[cur];$('#mn').innerHTML=P[cur]();setTimeout(()=>tick(1),0);$('#sd').classList.remove('o')}
function go(){const h=location.hash.slice(1);cur=P[h]?h:'dashboard';render();scrollTo(0,0)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('s');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('s'),2600)}
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;const v=parseFloat(e.target.value),pt=k.split('.');
const bad=!isFinite(v)||v<0?'Please enter a number that is zero or greater.':/\.rel$/.test(k)&&(v<=0||v>1)?'Reliability must be between 0.01 and 1.':/^p\.(r|mh|lh|mhA|lhA|cap)$/.test(k)&&v<=0?'This value must be greater than zero.':'';
if(bad){toast(bad);render();return}let o=S;for(let i=0;i<pt.length-1;i++)o=o[pt[i]];const old=o[pt[pt.length-1]];o[pt[pt.length-1]]=v;
if(S.wh.reduce((a,w)=>a+w.d,0)<=0){o[pt[pt.length-1]]=old;toast('Total demand must be above zero.');render();return}run();render();toast(R.status=='optimal'?'Model re-optimized':'Model could not be solved – see message')});
$('#run').onclick=()=>{run();if(cur=='dashboard'||cur=='analytics')location.hash='optimize';else render();toast(R.status=='optimal'?'Optimization complete – '+fm(R.tB-R.tO)+' saved':'Optimization failed')};
$('#mb').onclick=()=>$('#sd').classList.toggle('o');addEventListener('hashchange',go);
function pdf(lines){const e=s=>s.replace(/[\\()]/g,'\\$&'),st='BT /F1 10 Tf 40 800 Td 14 TL\n'+lines.map(l=>`(${e(l)}) Tj T*`).join('\n')+'\nET',o=['<</Type/Catalog/Pages 2 0 R>>','<</Type/Pages/Kids[3 0 R]/Count 1>>','<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Contents 4 0 R/Resources<</Font<</F1 5 0 R>>>>>>',`<</Length ${st.length}>>stream\n${st}\nendstream`,'<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>'];
let out='%PDF-1.4\n',off=[];o.forEach((b,i)=>{off.push(out.length);out+=`${i+1} 0 obj\n${b}\nendobj\n`});const x=out.length;out+=`xref\n0 ${o.length+1}\n0000000000 65535 f \n`+off.map(v=>String(v).padStart(10,'0')+' 00000 n \n').join('')+`trailer<</Size ${o.length+1}/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`;return new Blob([out],{type:'application/pdf'})}
async function exp(t){const d=window.claude&&await claude.use('downloads');if(!d){toast('Downloads are not available in this view');return}if(!ok()){toast('Run a valid optimization first');return}
const L=[['SCOP Optimization Report - Multan Cotton Yarn Mills'],[],['Component','Before (PKR)','After (PKR)']].concat([['Procurement','proc'],['Production','prod'],['Inventory','inv'],['Transportation','trans'],['Shortage','short']].map(c=>[c[0],Math.round(R.b[c[1]]),Math.round(R.o[c[1]])]),[['Total',Math.round(R.tB),Math.round(R.tO)],['Savings',Math.round(R.tB-R.tO)],[],['Supplier','Units bought']],S.sup.map((u,i)=>[u.n,n1(R.q[i])]),[[],['Warehouse','Delivered','Unmet']],S.wh.map((w,k)=>[w.n,n1(R.y[k]),n1(R.s[k])]),[[],['Production units',n1(R.P)],['Demand fulfilment',pc((R.D-R.unmet)/R.D)]]);
try{if(t=='csv')await d.save({filename:'scop-report.csv',data:new Blob([L.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'})});else await d.save({filename:'scop-report.pdf',data:pdf(L.map(r=>r.join('   ')))});toast('Report ready')}catch(e){if(e&&e.code!='declined')toast('Could not save the report')}}
/* ---------- live dashboard (simulated telemetry around the optimized plan) ---------- */
let LV={on:1,u:[],prod:0,raw:0,ev:[]};
const tm=o=>new Date().toLocaleTimeString('en-PK',Object.assign({timeZone:'Asia/Karachi'},o));
const ev=t=>{LV.ev.unshift(tm({hour:'2-digit',minute:'2-digit',second:'2-digit'})+' · '+t);LV.ev.length=Math.min(LV.ev.length,6)};
const sp=a=>{const mn=Math.min(...a),mx=Math.max(...a),rg=(mx-mn)||1,pts=a.map((v,i)=>`${(i*220/(a.length-1)).toFixed(1)},${(42-(v-mn)/rg*38).toFixed(1)}`).join(' ');return`<svg viewBox="0 0 220 46" class="ch"><polyline points="${pts}" fill="none" stroke="var(--b)" stroke-width="2.2" stroke-linejoin="round"/></svg>`};
const hero=()=>`<div class="hero"><div><span class="lp"><i></i>LIVE · simulated feed</span><h2>Multan Cotton Yarn Mills</h2><p>Optimized plan · ${new Date().toLocaleDateString('en-PK',{dateStyle:'long',timeZone:'Asia/Karachi'})}</p></div><div class="hs"><div><b id="clk"></b><small>Multan time</small></div><div><b>${fm(R.tB-R.tO)}</b><small>Savings found</small></div><div><b>${pc((R.D-R.unmet)/R.D)}</b><small>Demand met</small></div></div></div>`;
function live(){if(!LV.u.length){const b=S.p.mh*R.P/S.p.mhA*100;for(let i=0;i<30;i++)LV.u.push(b);LV.prod=R.P*.62;LV.raw=S.inv.raw+60;ev('Optimized plan loaded: produce '+n1(R.P)+' units')}
return`<div class="grid g2"><div class="card"><h3>Live plant telemetry <button class="btn o" style="float:right;padding:4px 10px" onclick="LV.on=!LV.on;this.textContent=LV.on?'⏸ Pause':'▶ Resume'">${LV.on?'⏸ Pause':'▶ Resume'}</button></h3><div class="lr"><span>Machine utilisation</span><b id="lu"></b></div><div id="su"></div><div class="lr"><span>Units produced vs plan</span><b id="lq"></b></div><div class="pb"><div id="pbar"></div></div><div class="lr"><span>Raw cotton stock</span><b id="lr"></b></div></div><div class="card"><h3>Live activity feed</h3><ul id="tk" class="tk"></ul></div></div>`}
function tick(f){const c=$('#clk');if(c)c.textContent=tm();if(cur!='dashboard'||!ok()||!$('#lu'))return;
if(LV.on&&!f){const b=S.p.mh*R.P/S.p.mhA*100;LV.u.push(Math.max(40,Math.min(99,b+(Math.random()-.5)*8)));LV.u.shift();LV.prod+=R.P/150*(.6+Math.random());
if(LV.prod>=R.P){LV.prod=0;ev('Batch complete – '+n1(R.P)+' units ready for dispatch')}
LV.raw-=2*(.5+Math.random());if(LV.raw<S.inv.rawMin+20){const i=Math.floor(Math.random()*3),a=Math.round(S.sup[i].cap/8);LV.raw+=a;ev(S.sup[i].n+' delivery arrived: +'+a+' units')}
if(Math.random()<.06){ev('Truck dispatched to '+S.wh[Math.floor(Math.random()*3)].n)}}
$('#lu').textContent=LV.u[LV.u.length-1].toFixed(1)+'%';$('#su').innerHTML=sp(LV.u);$('#lq').textContent=n1(LV.prod)+' / '+n1(R.P);$('#pbar').style.width=(100*LV.prod/R.P)+'%';$('#lr').textContent=n1(LV.raw)+' units';$('#tk').innerHTML=LV.ev.map(e=>`<li>${esc(e)}</li>`).join('')}
setInterval(()=>tick(),1000);
run();go();
</script></body></html>
